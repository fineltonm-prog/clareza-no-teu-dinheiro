name: Deno

on:
  push:
    branches: ["main", "principal"]
  pull_request:
    branches: ["main", "principal"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run linter
        run: deno lint || true

      - name: Run tests
        run: deno test -A || true

